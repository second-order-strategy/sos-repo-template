# Required CI for every Second Order Strategy repository.
# SOS-EOS-001: EOS-APR-01 (machines gate), EOS-EVD-02 (evidence from the run), EOS-SUP-02.
# SOS-STD-001: CS-04.2, CS-05.2, CS-05.4, CS-05.5, CS-06.1, CS-06.2, CS-06.6.
# The org ruleset requires one check, "ci-gate", posted by GitHub Actions only.
# Changes to this file need the owner's review (CODEOWNERS).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_VERSION: "2.7.1"
  OSV_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
  SEMGREP_VERSION: "1.185.0"

jobs:
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.read.outputs.profile }}
      coverage_min: ${{ steps.read.outputs.coverage_min }}
      linear_key: ${{ steps.read.outputs.linear_key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - id: read
        run: python scripts/check_manifest.py sos-project.yml >> "$GITHUB_OUTPUT"

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit links its Linear issue; agent commits name the agent
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LINEAR_KEY: ${{ needs.manifest.outputs.linear_key }}
        run: python scripts/check_commits.py "$BASE" "$HEAD" "$LINEAR_KEY"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make lint

  test:
    name: test
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make install
      - name: Tests and coverage floor for this profile
        env:
          COVERAGE_MIN: ${{ needs.manifest.outputs.coverage_min }}
        run: make coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: |
            reports/junit.xml
            reports/coverage.xml
          if-no-files-found: warn

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned and checksum-verified)
        run: |
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history for secrets
        run: |
          mkdir -p reports
          ./gitleaks git --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path reports/gitleaks.sarif

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install osv-scanner (pinned and checksum-verified)
        run: |
          curl -sSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan lock files for known vulnerabilities
        run: ./osv-scanner scan source --recursive .

  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Static analysis
        run: semgrep scan --config p/default --error --metrics=off

  evidence:
    name: evidence
    if: always()
    needs: [manifest, commits, lint, test, secrets, dependencies, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Write the evidence record from this run
        env:
          RESULTS: ${{ toJSON(needs) }}
          PROFILE: ${{ needs.manifest.outputs.profile }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, datetime
          needs = json.loads(os.environ["RESULTS"])
          record = {
              "standard": "SOS-EOS-001 v1.0 / SOS-STD-001 v1.2",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["SHA"],
              "profile": os.environ.get("PROFILE") or "unknown",
              "run": os.environ["RUN_URL"],
              "produced_by": "GitHub Actions, workflow ci",
              "produced_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "checks": {
                  name: {"success": "passed", "failure": "failed",
                         "skipped": "not run", "cancelled": "not run"}.get(v["result"], v["result"])
                  for name, v in needs.items()
              },
          }
          with open("evidence/ci-evidence.json", "w") as f:
              json.dump(record, f, indent=2)
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence
          path: evidence/ci-evidence.json

  ci-gate:
    name: ci-gate
    if: always()
    needs: [manifest, commits, lint, test, secrets, dependencies, sast, evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = []
          for name, v in needs.items():
              if name == "commits" and os.environ["EVENT"] != "pull_request" and v["result"] == "skipped":
                  continue
              if v["result"] != "success":
                  bad.append(f"{name}: {v['result']}")
          if bad:
              print("Blocked: " + ", ".join(bad))
              sys.exit(1)
          print("All required checks passed.")
          PY
